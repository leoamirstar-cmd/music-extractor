<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هاب بازی‌های پارسی</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- فونت‌های پارسی -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
  
  <!-- آیکون‌های FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- پس‌زمینه با نقش کاخ‌های پارسه / تخت جمشید -->
  <div class="persepolis-bg"></div>

  <!-- صفحه منوی اصلی -->
  <div id="main-menu" class="screen active">
    
    <header class="top-bar">
      <div class="user-profile">
        <div class="avatar-frame">
          <i class="fa-solid fa-crown avatar-icon"></i>
        </div>
        <div class="user-info">
          <span class="username">سرباز جاویدان</span>
          <span class="status"><i class="fa-solid fa-shield-halved"></i> آماده نبرد</span>
        </div>
      </div>
      <div class="coin-badge">
        <span>۱,۲۵0</span> <i class="fa-solid fa-coins coin-icon"></i>
      </div>
    </header>

    <h2 class="section-title">گذرگاه پارسه</h2>

    <div class="games-container">
      
      <div class="featured-card" onclick="openGame('dots-boxes')">
        <div class="card-banner">
          <div class="farvahar-icon">🏛️</div>
          <div class="badge">کلاسیک اصیل</div>
        </div>
        <div class="card-body">
          <h3 class="game-name">نقطه و خط هخامنشی</h3>
          <p class="game-desc">نبرد هوش و اندیشه • رقابت با هوش مصنوعی</p>
          <button class="play-now-btn">
            <span>ورود به تالار نبرد</span>
            <i class="fa-solid fa-feather-pointed"></i>
          </button>
        </div>
      </div>

      <div class="secondary-card locked">
        <div class="mini-icon"><i class="fa-solid fa-scroll"></i></div>
        <div class="card-info">
          <h3>تخته‌نرد کوروش</h3>
          <p>در حال ساخت در تالار...</p>
        </div>
        <i class="fa-solid fa-lock lock-icon"></i>
      </div>

    </div>
  </div>

  <!-- صفحه بازی -->
  <div id="game-screen" class="screen">
    <header class="game-header">
      <button class="back-btn" onclick="showMenu()"><i class="fa-solid fa-arrow-right"></i></button>
      <h2 id="game-title">نقطه و خط</h2>
    </header>
    <div id="board-container"></div>
  </div>

  <script src="menu.js"></script>
  <script src="dots_boxes.js"></script>
</body>
</html>
