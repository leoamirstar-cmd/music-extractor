<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>هاب بازی‌های ایرانی</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- فونت‌های اصیل ایرانی (لاله‌زار و ناهید) -->
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
  
  <!-- کتابخانه آیکون FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- کتابخانه انیمیشن حرفه‌ای GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <!-- پس‌زمینه پویا با الگوی اسلیمی -->
  <div class="pattern-bg"></div>

  <div id="main-menu" class="screen active">
    
    <!-- هدر سنتی مدرن -->
    <header class="top-bar">
      <div class="user-profile">
        <div class="avatar-frame">
          <i class="fa-solid fa-chess-knight avatar-icon"></i>
        </div>
        <div class="user-info">
          <span class="username">پهلوان جوان</span>
          <span class="status"><i class="fa-solid fa-circle status-dot"></i> آماده بازی</span>
        </div>
      </div>
      <div class="coin-badge">
        <span>۱,۲۵۰</span> <i class="fa-solid fa-coins coin-icon"></i>
      </div>
    </header>

    <h2 class="section-title">گذر بازی‌ها</h2>

    <div class="games-container">
      
      <!-- بنر اصلی نقطه و خط با طرح ایرانی -->
      <div class="featured-card" onclick="openGame('dots-boxes')">
        <div class="card-banner">
          <div class="banner-pattern"></div>
          <i class="fa-solid fa-pen-ruler banner-icon"></i>
          <div class="badge">بازی اصلی</div>
        </div>
        <div class="card-body">
          <h3 class="game-name">نقطه و خط</h3>
          <p class="game-desc">نبرد هوش و هوشمندی • رقابت با ربات</p>
          <button class="play-now-btn">
            <span>ورود به حجره بازی</span>
            <i class="fa-solid fa-arrow-left"></i>
          </button>
        </div>
      </div>

      <!-- کارت‌های در دست ساخت -->
      <div class="secondary-card locked">
        <div class="mini-icon"><i class="fa-solid fa-dice"></i></div>
        <div class="card-info">
          <h3>تخته و منچ</h3>
          <p>در حال آماده‌سازی...</p>
        </div>
        <i class="fa-solid fa-lock lock-icon"></i>
      </div>

    </div>
  </div>

  <!-- صفحه اصلی بازی -->
  <div id="game-screen" class="screen">
    <header class="game-header">
      <button class="back-btn" onclick="showMenu()"><i class="fa-solid fa-right-from-bracket"></i></button>
      <h2 id="game-title">نقطه و خط</h2>
    </header>
    <div id="board-container">
      <p>در حال بارگذاری تخته...</p>
    </div>
  </div>

  <script src="menu.js"></script>
  <script src="dots_boxes.js"></script>
</body>
</html>
