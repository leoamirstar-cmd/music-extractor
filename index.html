<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- هدر بالای منو -->
  <div id="main-menu" class="screen active">
    <header class="top-bar">
      <div class="user-profile">
        <div class="avatar">🎮</div>
        <div class="user-info">
          <span class="username">بازیکن جدید</span>
          <span class="status">آفلاین</span>
        </div>
      </div>
    </header>

    <h2 class="section-title">بازی‌ها</h2>

    <!-- لیست بازی‌ها به سبک پلاتو -->
    <div class="games-grid">
      
      <!-- کارت بازی نقطه و خط -->
      <div class="game-card" onclick="openGame('dots-boxes')">
        <div class="card-icon" style="background: linear-gradient(135deg, #FF6B6B, #FF8E53);">
          ✏️
        </div>
        <div class="card-details">
          <h3>نقطه و خط</h3>
          <p>کلاسیک و فکری • ۲ نفره</p>
        </div>
        <div class="play-btn">بازی</div>
      </div>

      <!-- کارت بازی به‌زودی -->
      <div class="game-card locked">
        <div class="card-icon" style="background: linear-gradient(135deg, #4A00E0, #8E2DE2);">
          🎲
        </div>
        <div class="card-details">
          <h3>منچ یا دوز</h3>
          <p>به‌زودی اضافه می‌شود...</p>
        </div>
        <div class="lock-icon">🔒</div>
      </div>

    </div>
  </div>

  <!-- صفحه بازی -->
  <div id="game-screen" class="screen">
    <header class="game-header">
      <button class="back-btn" onclick="showMenu()">✕</button>
      <h2 id="game-title">نقطه و خط</h2>
    </header>
    <div id="board-container">
      <p>در حال بارگذاری تخته...</p>
    </div>
  </div>

  <script src="menu.js"></script>
  <script src="dots_boxes.js"></script>
</body>
</html>
