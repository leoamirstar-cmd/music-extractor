<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Hub</title>
  <link rel="stylesheet" href="style.css">
  <!-- اضافه کردن فونت‌های زیبا -->
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <div id="main-menu" class="screen active">
    
    <!-- پروفایل بالا -->
    <header class="top-bar">
      <div class="user-profile">
        <div class="avatar">🎮</div>
        <div class="user-info">
          <span class="username">بازیکن جدید</span>
          <span class="status">آفلاین</span>
        </div>
      </div>
    </header>

    <h2 class="section-title">انتخاب بازی</h2>

    <!-- شبکه‌بندی بازی‌ها (سبک کارت‌های بزرگ پلاتو) -->
    <div class="games-container">
      
      <!-- بنر اصلی بازی نقطه و خط -->
      <div class="featured-card" onclick="openGame('dots-boxes')">
        <div class="card-banner">
          <div class="banner-icon">✏️</div>
          <div class="badge">محبوب</div>
        </div>
        <div class="card-body">
          <h3 class="game-name">نقطه و خط</h3>
          <p class="game-desc">بازی فکری ۲ نفره • رقابت با ربات</p>
          <button class="play-now-btn">شروع بازی</button>
        </div>
      </div>

      <!-- کارت بازی‌های بعدی (قفل شده) -->
      <div class="secondary-card locked">
        <div class="mini-icon">🎲</div>
        <div class="card-info">
          <h3>منچ و دوز</h3>
          <p>به‌زودی...</p>
        </div>
        <span class="lock">🔒</span>
      </div>

    </div>
  </div>

  <!-- صفحه اصلی بازی -->
  <div id="game-screen" class="screen">
    <header class="game-header">
      <button class="back-btn" onclick="showMenu()">✕</button>
      <h2 id="game-title">نقطه و خط</h2>
    </header>
    <div id="board-container">
      <p>در حال بارگذاری تخته...</p>
    </div>
  </div>

  <script src="menu.js"></script>
  <script src="dots_boxes.js"></script>
</body>
</html>
